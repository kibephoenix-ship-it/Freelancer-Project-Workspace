kind = "web"
previewPath = "/"
title = "Syncflow"
description = "A focused workspace for independent consultants to manage clients, projects, AI-assisted proposals, and invoices from one place."
version = "1.0.0"
id = "artifacts/freelancer-workspace"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19282

[services.development]
run = "pnpm --filter @workspace/freelancer-workspace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/freelancer-workspace", "run", "build" ]
serve = "static"
publicDir = "artifacts/freelancer-workspace/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19282"
BASE_PATH = "/"
